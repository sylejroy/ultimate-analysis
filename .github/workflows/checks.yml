name: checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check src tests scripts main.py
      - run: python -m ruff format --check src tests scripts main.py

  tests:
    # The tests need no GPU, videos or weights, but they import the libraries. Not yet
    # proven to pass on a clean machine: allowed to fail until it has
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
      YOLO_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
