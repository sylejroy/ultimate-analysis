# Ultimate Analysis - Default Configuration
# This file contains all default settings for the application

# Application Settings
app:
  name: "Ultimate Analysis"
  version: "0.1.0"
  log_level: "INFO"

# Video Processing Settings
video:
  default_fps: 25                # Used when a video file reports no valid frame rate
  default_video: "portland_vs_san_francisco_2024_snippet_4_40912.mp4"  # Opened at startup if present

# Model Configuration
models:
  base_path: "data/models"
  
  # Inference optimization settings
  inference:
    half_precision: true  # Use FP16 for ~2x speedup (requires compatible GPU)
    warmup_on_load: true   # Pre-warm models to avoid first-frame delay
    tensorrt: true         # Use a TensorRT engine when one was built for the model (scripts/export_tensorrt.py)
  
  # Separate player and disc detection models
  player_detection:
    default_model: "data/models/detection/20261005_1_detection_yolo26s_players_merged.v2.yolov8/finetune_20261005_010313/weights/best.pt"
    confidence_threshold: 0.5
    nms_threshold: 0.45
    
  disc_detection:
    default_model: "data/models/detection/20261004_1_detection_yolo26s_discs_merged.v2.yolov8/finetune_20261004_231958/weights/best.pt"
    confidence_threshold: 0.3
    nms_threshold: 0.45
    adaptive_skip: true          # Skip disc model when no disc detected recently
    skip_threshold: 30           # Frames without disc before skipping disc model
    follow_window: 0             # Side of the area searched around a followed disc, in frame pixels (0 = always the whole frame). Off: with a TensorRT engine for the window the app crashed during playback, without one the window is slower than the whole frame
    follow_max_missing: 5        # Frames the followed disc may be missing before the whole frame is searched again
    full_search_interval: 15     # Search the whole frame at least this often, so a wrong lock does not last
  
  segmentation:
    default_model: "data/models/segmentation/20250826_1_segmentation_yolo11s-seg_field finder.v8i.yolov8/finetune_20250826_092226/weights/best.pt"
    confidence_threshold: 0.4   # 0.6 cut the far end zone away in about one frame in five
    show_raw_masks: false      # Whether to show raw segmentation model output masks
    frame_interval: 5           # Process segmentation every N frames (1=every frame, 5=every 5th)
    iou_threshold: 0.7          # IoU threshold for segmentation
    
    # Morphological operations for mask smoothing
    morphological:
      opening_kernel_size: 5     # Size for noise removal (0 to disable)
      closing_kernel_size: 5    # Size for hole filling (0 to disable)
      fill_holes: false           # Apply flood fill for remaining holes
    
    # Contour calculation and drawings
    contour:
      simplify_epsilon: 0.0001     # Contour simplification factor (fraction of perimeter)
      min_area: 5000             # Minimum contour area to consider
      line_color: [255, 255, 0]  # BGR color for contour lines (yellow)
      point_color: [0, 255, 255] # BGR color for contour points (cyan)
      line_thickness: 3          # Thickness of contour lines
      point_radius: 5            # Radius of contour points
      draw_points: true          # Whether to draw individual contour points
      
      # Contour interpolation parameters
      interpolation:
        enabled: true            # Whether to interpolate contour points for denser sampling
        max_point_distance: 20   # Maximum distance between consecutive points in pixels
        min_point_distance: 3    # Minimum distance to avoid over-densification
      
      # RANSAC line fitting parameters
      ransac:
        enabled: true            # Whether to use RANSAC line fitting instead of contour
        num_lines: 4            # Number of line segments to fit (3-4 for field boundaries)
        distance_threshold: 5.0 # Maximum distance from point to line for inliers
        min_samples: 2          # Minimum number of points needed to fit a line
        max_trials: 100         # Point pairs tried per line (all at once, so they are cheap)
        min_line_length: 60     # Pixels; anything shorter is a corner or dent, not a field line
        backend: "numpy"        # Line fitter: "numpy" (fast, fits vertical lines) or "sklearn"
        line_color: [0, 255, 0] # BGR color for RANSAC lines (green)
        outlier_color: [0, 165, 255] # BGR color for RANSAC outlier points (orange)
        outlier_radius: 6       # Radius for outlier point visualization (increased for visibility)
        show_outliers: true     # Whether to visualize RANSAC outliers (enabled)
        inlier_color: [0, 255, 0] # BGR color for RANSAC inlier points (green)
        inlier_radius: 5        # Radius for inlier point visualization (increased for visibility)
        show_inliers: true      # Whether to visualize RANSAC inliers (enabled)
        
        # Edge filtering parameters
        edge_filtering:
          enabled: true         # Whether to filter points near image edges
          margin: 15           # Distance from edge in pixels to consider as "near edge"
          edge_point_color: [0, 0, 255] # BGR color for filtered edge points (red)
          edge_point_radius: 6  # Radius for edge point visualization (increased for visibility)
          show_edge_points: true # Whether to visualize filtered edge points
  
  tracking:
    track_history_length: 300
    camera_motion_compensation: true   # Keep trails on the ground when the camera pans or zooms
    
    # DeepSORT specific settings (optimized for performance)
    max_age_seconds: 3.0         # How long a player who is not detected is remembered and can return as the same track

    # Player identities: a player who was lost and comes back as a new track is recognised
    identity:
      enabled: true
      memory_seconds: 30.0                # How long a missing player is remembered, to be recognised by their number
      position_match_seconds: 0.0         # Up to this long after a player was lost, a new track where they must be is them. Off (0): on test footage it recovered no player and joined two different ones once
      max_speed_heights_per_second: 5.0   # Top speed of a player, in body heights per second
      max_acceleration_heights_per_second2: 4.0  # How fast a player can change speed or direction
      carry_on_seconds: 1.0               # For this long a missing player is expected to carry on as they were going
      min_margin: 0.25                    # How much nearer than any other candidate a match must be (share of the reachable distance)
      max_kit_distance: 30.0              # Average kit colours further apart than this (Lab units) are different teams: same number, different player
      appearance_interval: 10             # Frames between looks at a player's kit colour
      number_certainty: 0.6               # Certainty of a jersey number from which it identifies a missing player
    n_init: 3                    # Frames needed to confirm a track
    nms_overlap: 0.7             # Non-maximum suppression overlap threshold
    max_cosine_distance: 0.5     # Feature similarity threshold (tighter for faster matching)
    nn_budget: 50                # Feature budget per class (reduced from 100 for speed)
    
  # Possession: the disc belongs to the player whose box it is in
  possession:
    confirm_frames: 10           # Frames the disc must be seen at another player (or at none) before the holder changes
    box_margin: 0.15             # Player boxes are widened by this fraction; a held disc is often just outside

  player_id:
    # Jersey number reader: easyocr, parseq, florence, or yolo_digits (also selectable in the GUI).
    # parseq read 18 of 23 test players with none wrong, at EasyOCR's speed; see README.
    method: "parseq"
    florence:
      min_confidence: 0.7          # Below this the model is guessing; lower finds more numbers but more wrong ones
    yolo_digits:
      model: ""                    # Digit detector weights; empty = newest detection run trained on a digits dataset
      min_confidence: 0.5

    # Performance optimization: only run OCR on a subset of frames per track
    ocr_frame_interval: 5          # Run OCR for a given track every N frames (>=1)
    ocr_frame_interval_stagger: true # Stagger per track using track_id % interval to spread load
    finalized_certainty_threshold: 0.9 # Probability at which jersey number is considered final (skip future OCR) - reduced from 0.999 for faster finalization
    verbose_debug: false           # Enable extra per-crop debug logging when troubleshooting
    
    # Jersey number tracking settings
    tracking:
      max_history_length: 40              # Readings kept per player
      min_readings: 2                     # Times a number must be read before it is shown
      unknown_weight: 1.0                 # Votes held back for "unknown": one reading is never certain
      spatial_weight_center_bonus: 0.3    # Bonus weight for center-positioned digits
      center_region_width: 0.4            # Width of "center" region (fraction of bbox)

# Logging Settings
logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Homography Estimation Settings
homography:
  save_directory: "configs"
  default_params_file: "configs/homography_params.yaml"
  slider_range_main: [-100.0, 100.0]          # Range for H00, H01, H10, H11 (scale/skew/extreme) - expanded from [-50.0, 50.0]
  slider_range_perspective: [-0.2, 0.2]      # Range for H20, H21 (perspective/extreme)
  buffer_factor: 1.8                         # Output canvas size multiplier (1.8 = 80% larger)
  output_aspect_ratio: 3.0                   # Height:width ratio for homography output canvas (3.0 = 3:1)
  display_scale: 0.5                         # Main-tab top-down view render scale (1.0 = full canvas, sharper when zoomed but ~4x slower warp)

# Genetic Algorithm Optimization Settings
optimization:
  # Population Parameters
  ga_population_size: 20
  ga_elite_size: 2              # Number of best individuals to preserve
  ga_mutation_rate: 0.2         # Probability of parameter mutation
  ga_crossover_rate: 0.7        # Probability of crossover between parents
  
  # Fitness Function Weights (must sum to 1.0)
  ga_fitness_weights:
    alignment: 0.35             # Line alignment (vertical/horizontal)
    coverage: 0.2               # Field coverage preservation  
    visibility: 0.15            # Line visibility in warped view
    proportion: 0.1             # Field proportion accuracy
    distortion: 0.05            # Perspective distortion penalty
    orientation: 0.15           # Vertical/horizontal line balance reward
  
  # Continuous Evolution Settings
  continuous_evolution_interval_ms: 1000  # Milliseconds between generations in continuous mode
  convergence_threshold: 0.95             # Fitness threshold to stop continuous evolution
  max_generations: 200                    # Maximum generations for continuous evolution
  
  # Line Alignment Evaluation
  ga_line_alignment:
    vertical_tolerance: 5.0     # Degrees tolerance for vertical lines
    horizontal_tolerance: 5.0   # Degrees tolerance for horizontal lines
    min_line_length: 10         # Minimum line length to consider (pixels)
  
  # Field Coverage Evaluation  
  ga_field_coverage:
    black_pixel_threshold: 10   # Pixels below this value considered "black"
    optimal_coverage_ratio: 0.75 # Optimal ratio of non-black pixels (avoids over-zooming)
  
  # Field Proportion Evaluation
  ga_field_proportion:
    expected_ratio: 2.7         # Ultimate field width:length ratio
    ratio_tolerance: 0.5        # Acceptable deviation from expected ratio

  # Line Orientation Balance Evaluation
  ga_line_orientation:
    vertical_tolerance: 15.0    # Degrees tolerance for vertical line classification
    horizontal_tolerance: 15.0  # Degrees tolerance for horizontal line classification  
    min_line_length: 20         # Minimum line length to consider (pixels)
    missing_orientation_penalty: 0.5  # Penalty for missing vertical OR horizontal lines
